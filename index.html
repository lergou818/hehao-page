<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可以和好吗？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffc0cb;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 第一页 */
        #page1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .cat-emoji {
            font-size: 100px;
        }
        .question {
            font-size: 26px;
            color: #333;
        }
        .bubble-container {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }
        .bubble {
            padding: 15px 30px;
            border-radius: 30px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .bubble.pink {
            background-color: #ff69b4;
            color: white;
        }
        .bubble.blue {
            background-color: #1e90ff;
            color: white;
        }
        /* 第二页 */
        #page2 {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .love-emoji {
            font-size: 100px;
        }
        .love-text {
            font-size: 26px;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- 第一页：委屈猫猫 + 互动气泡 -->
    <div id="page1">
        <div class="cat-emoji">🥺</div>
        <div class="question">可以和好吗？</div>
        <div class="bubble-container">
            <button class="bubble pink" onclick="goToPage2()">原谅你了</button>
            <button class="bubble blue" onclick="changeSize()">不要</button>
        </div>
    </div>

    <!-- 第二页：开心猫猫 + 文字 -->
    <div id="page2">
        <div class="love-emoji">🥰</div>
        <div class="love-text">最爱宝宝了！😙</div>
    </div>

    <script>
        let scaleFactor = 1;
        // 点击蓝色“不要”按钮：越点越小，粉色按钮越点越大
        function changeSize() {
            scaleFactor -= 0.1;
            const pinkBubble = document.querySelector('.bubble.pink');
            const blueBubble = document.querySelector('.bubble.blue');
            pinkBubble.style.transform = `scale(${1 + (1 - scaleFactor)})`;
            blueBubble.style.transform = `scale(${scaleFactor})`;
            if (scaleFactor <= 0.1) {
                blueBubble.style.display = 'none';
            }
        }

        // 点击粉色“原谅你了”：跳转到第二页
        function goToPage2() {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'flex';
        }
    </script>
</body>
</html>
